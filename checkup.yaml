# yaml-language-server: $schema=checkup.schema.json

tags:
  project: checkup

providers:
  - name: git

metrics:
  - type: git_days_since_last_update
  - type: git_tracked_file_count
    name: checkup_yaml_exists
    description: Checkup yaml exists
    pattern: checkup.yaml
  - type: git_tracked_file_count
    name: pre_commit_config_exists
    description: Pre-commit config exists
    pattern: .pre-commit-config.yaml
  - type: python_version
  - type: python_version_check
    min_version: "3.13"
    max_version: "3.15"

materializer:
  type: console
  pretty: true
